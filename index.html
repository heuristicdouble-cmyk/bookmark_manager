<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bookmark Manager</title>
  </head>
  <body>
    <header>Bookmark Manager<button class="button-add">+Add</button></header>

    <!--追加時のモーダル-->
    <dialog class="add-modal">
      <form class="form-add">
        <section>
          <h3>Add new bookmark</h3>
          <label for="input-title">Title</label>
          <input type="text" id="input-title" required />
          <br />
          <label for="input-url">URL</label>
          <input type="url" id="input-url" required />
        </section>

        <button class="form-button-save" type="submit">Save</button>
      </form>
      <button class="form-button-cancel">Cancel</button>
    </dialog>

    <!--編集時のモーダル-->
    <dialog class="edit-modal">
      <form class="form-edit">
        <section>
          <h4>Edit Bookmark</h4>
          <label for="input-edit-title">Title</label>
          <input type="text" id="input-edit-title" />
          <br />
          <label for="input-edit-url">URL</label>
          <input type="url" id="input-edit-url" />
        </section>
        <button class="form-button-edit-save" type="submit">Save</button>
      </form>
      <button class="form-button-edit-cancel">Cancel</button>
    </dialog>

    <!--削除時のモーダル-->
    <dialog class="delete-modal">
      <section>
        <h4>Delete Bookmark...?</h4>
      </section>
      <button class="form-button-delete">Delete</button>
      <button class="form-button-delete-cancel">Cancel</button>
    </dialog>

    <section class="bookmark-list"></section>
    <script src="./app.js"></script>
  </body>
</html>
